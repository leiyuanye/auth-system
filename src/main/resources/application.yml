server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/auth_system?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&nullCatalogMeansCurrent=true
    username: root
    password: 123
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.auth.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

jwt:
  secret: auth-system-secret-key-please-change-this-in-production
  expiration: 43200  # 12小时，单位：秒

logging:
  level:
    root: INFO
    com.example.auth: DEBUG
    org.mybatis: DEBUG
